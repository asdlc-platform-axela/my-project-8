apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: motor-claims-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: my-project-8-motor-claims-api
      name: http
      visibility: project
      envBindings:
        address: MOTOR_CLAIMS_API_URL
  resources:
    - ref: my-project-8-thunder-auth
      envBindings:
        client_id: THUNDER_AUTH_CLIENT_ID
        issuer: THUNDER_AUTH_ISSUER
        jwks_url: THUNDER_AUTH_JWKS_URL
        resource: THUNDER_AUTH_RESOURCE
        scopes: THUNDER_AUTH_SCOPES
