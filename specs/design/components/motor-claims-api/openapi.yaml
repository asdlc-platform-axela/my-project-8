openapi: 3.0.3
info:
  title: Motor Claims API
  version: 0.1.0
  description: Draft, attach to, submit and review a claimant's own motor insurance claims.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: The caller's own claims
            claims:save: Create or update a draft claim and its attachments
            claims:submit: Submit a completed draft claim
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    ClaimSummary:
      type: object
      required: [id, status, policyNumber, vehicleRegNumber, updatedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, submitted] }
        policyNumber: { type: string }
        vehicleRegNumber: { type: string }
        claimNumber: { type: string, nullable: true, description: assigned by the insurer on submission }
        submittedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    Claim:
      type: object
      required: [id, status, policyNumber, vehicleRegNumber]
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, submitted] }
        policyNumber: { type: string }
        vehicleRegNumber: { type: string }
        claimNumber: { type: string, nullable: true }
        insuredName: { type: string }
        insuredAddress: { type: string }
        insuredPhone: { type: string }
        insuredFax: { type: string }
        bankName: { type: string }
        bankAccountNumber: { type: string }
        ownerName: { type: string }
        ownerAddress: { type: string }
        financeInstitution: { type: string }
        driverName: { type: string }
        driverAge: { type: integer }
        driverRelationship: { type: string }
        driverLicenceNumber: { type: string }
        accidentDate: { type: string, format: date }
        accidentTime: { type: string }
        accidentLocation: { type: string }
        policeStation: { type: string }
        accidentDescription: { type: string }
        usage: { type: string, enum: [private, hire, self-drive, tuition, other] }
        goodsDamaged: { type: boolean }
        goodsDescription: { type: string }
        goodsValue: { type: number }
        passengerInjured: { type: boolean }
        injuredPassengerDetails: { type: string }
        thirdPartyInjured: { type: boolean }
        thirdPartyInjuryDetails: { type: string }
        thirdPartyPropertyDamaged: { type: boolean }
        thirdPartyPropertyDetails: { type: string }
        otherInsurance: { type: boolean }
        otherInsuranceDetails: { type: string }
        declarationAccepted: { type: boolean }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        submittedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
    ClaimDraftInput:
      type: object
      description: Any subset of Claim's own fields, applied to the draft.
      properties:
        policyNumber: { type: string }
        vehicleRegNumber: { type: string }
        insuredName: { type: string }
        insuredAddress: { type: string }
        insuredPhone: { type: string }
        insuredFax: { type: string }
        bankName: { type: string }
        bankAccountNumber: { type: string }
        ownerName: { type: string }
        ownerAddress: { type: string }
        financeInstitution: { type: string }
        driverName: { type: string }
        driverAge: { type: integer }
        driverRelationship: { type: string }
        driverLicenceNumber: { type: string }
        accidentDate: { type: string, format: date }
        accidentTime: { type: string }
        accidentLocation: { type: string }
        policeStation: { type: string }
        accidentDescription: { type: string }
        usage: { type: string, enum: [private, hire, self-drive, tuition, other] }
        goodsDamaged: { type: boolean }
        goodsDescription: { type: string }
        goodsValue: { type: number }
        passengerInjured: { type: boolean }
        injuredPassengerDetails: { type: string }
        thirdPartyInjured: { type: boolean }
        thirdPartyInjuryDetails: { type: string }
        thirdPartyPropertyDamaged: { type: boolean }
        thirdPartyPropertyDetails: { type: string }
        otherInsurance: { type: boolean }
        otherInsuranceDetails: { type: string }
        declarationAccepted: { type: boolean }
    Attachment:
      type: object
      required: [id, type, fileName]
      properties:
        id: { type: string }
        type: { type: string, enum: [driving-licence, bank-page] }
        fileName: { type: string }
        contentType: { type: string }
    AttachmentInput:
      type: object
      required: [type, fileName, contentType, content]
      properties:
        type: { type: string, enum: [driving-licence, bank-page] }
        fileName: { type: string }
        contentType: { type: string }
        content: { type: string, format: byte, description: base64-encoded file content }
security:
  - oauth2: []
paths:
  /me/claims:
    get:
      operationId: listMyClaims
      summary: The caller's own claims (drafts and submitted)
      security:
        - oauth2: [claims:read]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, submitted] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClaimSummary' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: startMyClaim
      summary: Start a new draft claim
      security:
        - oauth2: [claims:save]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDraftInput' }
      responses:
        '201':
          description: Draft claim created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}:
    get:
      operationId: getMyClaim
      summary: The caller's own claim, full detail
      security:
        - oauth2: [claims:read]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateMyClaimDraft
      summary: Update a draft claim's fields
      security:
        - oauth2: [claims:save]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDraftInput' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: The claim is not a draft, or the input is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}/attachments:
    post:
      operationId: addMyClaimAttachment
      summary: Attach a document to a draft claim
      security:
        - oauth2: [claims:save]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentInput' }
      responses:
        '201':
          description: Attachment stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400':
          description: The claim is not a draft, or the input is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}/submit:
    post:
      operationId: submitMyClaim
      summary: Submit a completed draft claim
      security:
        - oauth2: [claims:submit]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Claim submitted; a claim number is assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: The declaration was not confirmed, the claim is already submitted, or required fields are missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
